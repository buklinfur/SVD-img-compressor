name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ubuntu / gcc",   os: ubuntu-latest,  cc: gcc,   werror: ON }
          - { name: "ubuntu / clang", os: ubuntu-latest,  cc: clang, werror: ON }
          - { name: "macos / clang",  os: macos-latest,   cc: clang, werror: ON }
          - { name: "windows / msvc", os: windows-latest, cc: cl,    werror: OFF }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"

      - name: Install numpy (for the numpy cross-check test)
        if: runner.os == 'Linux'
        run: python -m pip install numpy

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSVDC_WERROR=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSVDC_SANITIZE=ON -DSVDC_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  valgrind:
    name: ubuntu / valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build (Debug, no OpenMP so that thread pools do not show up as leaks)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSVDC_OPENMP=OFF
          cmake --build build --parallel
      - name: Run under valgrind
        run: |
          VG="valgrind -q --leak-check=full --errors-for-leak-kinds=definite,indirect --error-exitcode=1"
          $VG build/test_svd
          $VG build/test_codec
          $VG build/svdc compress examples/test3.png rgba.svdc -k 20
          $VG build/svdc decompress rgba.svdc rgba.png
          $VG build/svdc compress examples/test2.png j.svdc --method jacobi -k 10 --bits 16
          $VG build/svdc info j.svdc

  make:
    name: ${{ matrix.os }} / plain make
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test
